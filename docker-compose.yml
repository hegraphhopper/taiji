services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fund_platform
      MYSQL_USER: fund
      MYSQL_PASSWORD: ${DB_PASSWORD:-fund_demo_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_demo_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_demo_password}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: fund_platform
      DB_USERNAME: fund
      DB_PASSWORD: ${DB_PASSWORD:-fund_demo_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-bytes}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-Admin@12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      DEMO_DATA_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
