spring:
  application:
    name: fund-platform
  profiles:
    active: demo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  name: 自投研发项目重复投入治理平台
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: 8
  upload:
    dir: ${UPLOAD_DIR:./storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  db:
    seed:
      enabled: ${DB_SEED_ENABLED:false}
      resource: ${DB_SEED_RESOURCE:classpath:db/seed/funddb.mv.db}
      target: ${DB_SEED_TARGET:}
      marker: ${DB_SEED_MARKER:}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:}
    model: ${LLM_MODEL:gpt-4o-mini}
    api-key: ${LLM_API_KEY:}
